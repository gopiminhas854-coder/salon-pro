<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Salon Pro — Admin Recovery</title>
  <style>
    body{margin:0;background:#f7f5f0;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:460px;margin:8vh auto;padding:16px}
    .card{background:#fff;border:1px solid #e5e1d8;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(25,22,18,.08)}
    h1{margin:0 0 8px;font-size:26px}.muted{color:#6f6a62;line-height:1.5}
    label{display:block;font-weight:700;margin:18px 0 8px}
    input{width:100%;box-sizing:border-box;min-height:48px;border:1px solid #d7d1c6;border-radius:11px;padding:0 13px;font-size:16px}
    button{width:100%;min-height:50px;margin-top:22px;border:0;border-radius:11px;background:#171717;color:#fff;font-weight:800;font-size:16px}
    .warn{background:#faf7ed;border:1px solid #e7dcc4;padding:12px;border-radius:12px;color:#5c503e}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Admin password recovery</h1>
    <p class="muted">This one-time recovery page is enabled only by the Salon Pro owner for a controlled password reset.</p>
    <div class="warn">Set a new password of at least 12 characters. After you reset it, recovery mode should be disabled.</div>
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Set new admin password</button>
    </form>
  </section>
</main>
</body>
</html>
