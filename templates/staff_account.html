{% extends "base.html" %}
{% block title %}Staff Login Account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<h3><i class="bi bi-person-lock"></i> Create Staff Login</h3>
<p class="text-muted">Create a separate login for <strong>{{ member.name }}</strong>. Staff accounts have restricted admin access.</p>
<form method="POST">
<div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" minlength="3" required></div>
<div class="mb-3"><label class="form-label">Temporary password</label><input name="password" type="password" class="form-control" minlength="8" required></div>
<button class="btn btn-primary"><i class="bi bi-person-plus"></i> Create Account</button>
<a href="{{ url_for('staff') }}" class="btn btn-outline-secondary">Cancel</a>
</form></div></div></div></div>
{% endblock %}
