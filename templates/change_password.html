{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3 class="mb-4"><i class="bi bi-key"></i> Change Password</h3>
<form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label class="form-label">Current password</label><input type="password" name="current_password" class="form-control mb-3" required>
<label class="form-label">New password</label><input type="password" name="new_password" class="form-control mb-3" minlength="8" required>
<label class="form-label">Confirm new password</label><input type="password" name="confirm_password" class="form-control mb-4" minlength="8" required>
<button class="btn btn-primary w-100">Update Password</button></form></div></div></div></div>
{% endblock %}
