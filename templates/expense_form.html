{% extends "base.html" %}
{% block title %}Add Expense{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-4">
<h3 class="mb-4"><i class="bi bi-wallet2"></i> Add Expense</h3>
<form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Expense title</label><input name="title" class="form-control" placeholder="Electricity, rent, products..." required></div>
<div class="mb-3"><label class="form-label">Category</label><select name="category" class="form-select" required><option>Rent</option><option>Utilities</option><option>Products</option><option>Salary</option><option>Marketing</option><option>Maintenance</option><option>Other</option></select></div>
<div class="row g-3"><div class="col-md-6"><label class="form-label">Amount (₹)</label><input name="amount" type="number" step="0.01" min="0.01" class="form-control" required></div><div class="col-md-6"><label class="form-label">Date</label><input name="expense_date" type="date" class="form-control" value="{{ today if today else '' }}" required></div></div>
<div class="mb-3 mt-3"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3"></textarea></div>
<button class="btn btn-primary">Save Expense</button> <a href="{{ url_for('expenses') }}" class="btn btn-outline-secondary">Cancel</a>
</form></div></div></div></div>
{% endblock %}
