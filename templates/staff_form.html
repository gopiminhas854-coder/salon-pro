{% extends "base.html" %}
{% block title %}{{ 'Edit' if staff else 'Add' }} Staff{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">{{ 'Edit' if staff else 'Add New' }} Staff Member</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="name" class="form-control" required value="{{ staff.name if staff else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ staff.phone if staff else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ staff.email if staff else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Specialty</label>
                        <input type="text" name="specialty" class="form-control" placeholder="e.g. Hair Stylist, Makeup Artist" value="{{ staff.specialty if staff else '' }}">
                    </div>
                    {% if staff %}
                    <div class="mb-3 form-check">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if staff.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a href="{{ url_for('staff') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
