{% extends "base.html" %}
{% block title %}{{ 'Edit' if supplier else 'Add' }} Supplier{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3 class="mb-4">{{ 'Edit' if supplier else 'Add' }} Supplier</h3><form method="post"><div class="mb-3"><label class="form-label">Supplier Name</label><input name="name" class="form-control" value="{{ supplier.name if supplier else '' }}" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ supplier.email if supplier else '' }}"></div></div><div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control">{{ supplier.address if supplier else '' }}</textarea></div><div class="mb-3"><label class="form-label">Notes</label><textarea name="notes" class="form-control">{{ supplier.notes if supplier else '' }}</textarea></div><button class="btn btn-primary">Save Supplier</button> <a href="{{ url_for('suppliers') }}" class="btn btn-light">Cancel</a></form></div></div></div></div>
{% endblock %}
