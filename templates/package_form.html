{% extends "base.html" %}
{% block title %}Create Package{% endblock %}
{% block page_kicker %}Packages{% endblock %}
{% block content %}
<div class="card"><div class="card-body p-4"><h3 class="mb-1">Create package or membership</h3><div class="text-muted small mb-4">Define usage, validity and included services.</div><form method="post" class="row g-3"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" required></div><div class="col-md-3"><label class="form-label">Type</label><select name="package_type" class="form-select"><option>Package</option><option>Membership</option></select></div><div class="col-md-3"><label class="form-label">Price</label><input name="price" type="number" min="0" step="0.01" class="form-control" required></div><div class="col-md-4"><label class="form-label">Total uses</label><input name="total_uses" type="number" min="1" value="1" class="form-control" required></div><div class="col-md-4"><label class="form-label">Validity days</label><input name="validity_days" type="number" min="1" value="30" class="form-control" required></div><div class="col-md-12"><label class="form-label">Included services</label><input name="included_services" class="form-control" placeholder="4 Haircuts · 2 Hair Spa"></div><div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div><div class="col-12"><button class="btn btn-primary">Create package</button><a href="{{ url_for('packages') }}" class="btn btn-light ms-2">Cancel</a></div></form></div></div>
{% endblock %}
