{% extends "base.html" %}
{% block title %}{{ 'Edit' if service else 'Add' }} Service{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">{{ 'Edit' if service else 'Add New' }} Service</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Service Name *</label>
                            <input type="text" name="name" class="form-control" required value="{{ service.name if service else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select">
                                <option value="Hair" {% if service and service.category == 'Hair' %}selected{% endif %}>Hair</option>
                                <option value="Skin" {% if service and service.category == 'Skin' %}selected{% endif %}>Skin</option>
                                <option value="Nails" {% if service and service.category == 'Nails' %}selected{% endif %}>Nails</option>
                                <option value="Makeup" {% if service and service.category == 'Makeup' %}selected{% endif %}>Makeup</option>
                                <option value="Spa" {% if service and service.category == 'Spa' %}selected{% endif %}>Spa</option>
                                <option value="Other" {% if service and service.category == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="2">{{ service.description if service else '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Duration (minutes) *</label>
                            <input type="number" name="duration_minutes" class="form-control" required min="5" value="{{ service.duration_minutes if service else 30 }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Price (₹) *</label>
                            <input type="number" name="price" class="form-control" required min="0" step="1" value="{{ service.price if service else '' }}">
                        </div>
                        {% if service %}
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if service.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">Active</label>
                            </div>
                        </div>
                        {% endif %}
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Service</button>
                        <a href="{{ url_for('services') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
