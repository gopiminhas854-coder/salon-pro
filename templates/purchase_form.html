{% extends "base.html" %}
{% block title %}Record Purchase{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3 class="mb-4"><i class="bi bi-bag-plus"></i> Record Purchase</h3><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Product</label><select name="inventory_item_id" class="form-select" required><option value="">Select product</option>{% for i in items %}<option value="{{ i.id }}">{{ i.name }}{% if i.sku %} ({{ i.sku }}){% endif %}</option>{% endfor %}</select></div><div class="col-md-6 mb-3"><label class="form-label">Supplier</label><select name="supplier_id" class="form-select"><option value="">No supplier</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div></div><div class="row"><div class="col-md-4 mb-3"><label class="form-label">Quantity</label><input name="quantity" type="number" step="0.5" min="0.5" class="form-control" required></div><div class="col-md-4 mb-3"><label class="form-label">Unit Cost (₹)</label><input name="unit_cost" type="number" step="0.01" min="0" class="form-control" required></div><div class="col-md-4 mb-3"><label class="form-label">Purchase Date</label><input name="purchase_date" type="date" value="{{ today_iso }}" class="form-control" required></div></div><div class="mb-3"><label class="form-label">Reference / Bill No.</label><input name="reference" class="form-control"></div><div class="mb-3"><label class="form-label">Notes</label><textarea name="notes" class="form-control"></textarea></div><button class="btn btn-primary">Save Purchase & Add Stock</button> <a href="{{ url_for('purchases') }}" class="btn btn-light">Cancel</a></form></div></div></div></div>
{% endblock %}
