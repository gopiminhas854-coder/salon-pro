{% extends "base.html" %}
{% block title %}Attendance{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-person-check"></i> Staff Attendance</h2>
  <form class="d-flex gap-2" method="GET">
    <input type="date" name="date" class="form-control" value="{{ selected }}">
    <button class="btn btn-primary">View</button>
  </form>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Staff</th><th>Status</th><th>Check In</th><th>Check Out</th><th>Notes</th><th></th></tr></thead>
        <tbody>
        {% for s in staff_list %}
          {% set r = records.get(s.id) %}
          <form method="POST" action="{{ url_for('mark_attendance') }}">
          <input type="hidden" name="staff_id" value="{{ s.id }}">
          <input type="hidden" name="attendance_date" value="{{ selected }}">
          <tr>
            <td><strong>{{ s.name }}</strong><br><small class="text-muted">{{ s.specialty or 'General' }}</small></td>
            <td>
              <select name="status" class="form-select form-select-sm">
                {% for status in ['Present','Absent','Leave','Half Day'] %}
                <option {% if (r and r.status == status) or (not r and status == 'Present') %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
              </select>
            </td>
            <td><input type="time" name="check_in" class="form-control form-control-sm" value="{{ r.check_in if r else '' }}"></td>
            <td><input type="time" name="check_out" class="form-control form-control-sm" value="{{ r.check_out if r else '' }}"></td>
            <td><input name="notes" class="form-control form-control-sm" placeholder="Optional" value="{{ r.notes if r else '' }}"></td>
            <td><button class="btn btn-sm btn-success"><i class="bi bi-check2"></i> Save</button></td>
          </tr>
          </form>
        {% else %}
          <tr><td colspan="6" class="text-center text-muted py-4">No staff found.</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
