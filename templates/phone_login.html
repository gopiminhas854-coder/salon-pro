<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Login | Salon Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<main class="login-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;">
<section class="login-card p-4 p-sm-5" style="width:100%;max-width:430px;background:#fff;border:1px solid #e9e6df;border-radius:20px;box-shadow:0 12px 40px rgba(25,22,18,.08);">
<div class="text-center mb-4"><div class="login-mark mx-auto"><i class="bi bi-phone"></i></div><h1 class="h3 fw-bold mt-3 mb-1">Phone Login</h1><p class="text-muted">Enter the OTP sent to {{ phone }}</p></div>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label fw-semibold" for="code">6-digit OTP</label><input id="code" name="code" class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required autofocus></div>
<button class="btn btn-dark w-100"><i class="bi bi-check-circle me-1"></i>Verify &amp; Login</button>
</form>
<a href="{{ url_for('login') }}" class="btn btn-link w-100 mt-2">Use another login method</a>
</section></main>
</body></html>
