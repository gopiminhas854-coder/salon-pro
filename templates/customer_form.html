{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">{{ 'Edit' if customer else 'Add New' }} Customer</h4>
            </div>
            <div class="card-body">
                <form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" name="name" class="form-control" required value="{{ customer.name if customer else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone *</label>
                            <input type="text" name="phone" class="form-control" required value="{{ customer.phone if customer else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ customer.email if customer else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select">
                                <option value="">Select</option>
                                <option value="Male" {% if customer and customer.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if customer and customer.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if customer and customer.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Birthday</label>
                            <input type="date" name="date_of_birth" class="form-control" value="{{ customer.date_of_birth.isoformat() if customer and customer.date_of_birth else '' }}">
                            <div class="form-text">Used for client birthday reminders.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Anniversary</label>
                            <input type="date" name="anniversary_date" class="form-control" value="{{ customer.anniversary_date.isoformat() if customer and customer.anniversary_date else '' }}">
                            <div class="form-text">Optional wedding/relationship anniversary.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2">{{ customer.notes if customer else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Save Customer
                        </button>
                        <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
