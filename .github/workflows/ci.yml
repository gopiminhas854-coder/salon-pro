name: Salon Pro CI
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    env:
      SALON_PRO_ADMIN_PASSWORD: "ci-test-password-123"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m compileall -q app.py migrate_startup.py wsgi.py tests
      - run: python -c "import app; assert app.app.test_client().get('/health').status_code == 200"
      - run: python -m pytest -q tests
