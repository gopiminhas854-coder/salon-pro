name: Salon Pro Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare stable signing key
        working-directory: android
        run: |
          base64 --decode salonpro-debug.keystore.b64 > salonpro-debug.keystore
          chmod 600 salonpro-debug.keystore
          keytool -list -keystore salonpro-debug.keystore -storepass salonprodebug -alias salonpro -v | grep "SHA1:"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner: C=IN|SHA1: 9A:20:A3:41:7A:90:D6:97:02:F4:02:E9:60:D6:61:46:8E:8E:07:AB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salon-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
