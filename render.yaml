services:
  - type: web
    name: salon-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app db upgrade && gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SALON_PRO_SECRET_KEY
        generateValue: true
      - key: SALON_PRO_AUTO_CREATE_DB
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: salon-pro-db
          property: connectionString
databases:
  - name: salon-pro-db
