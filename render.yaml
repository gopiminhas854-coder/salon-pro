services:
  - type: web
    name: salon-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_startup.py && gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SALON_PRO_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: "production"
      - key: SALON_PRO_ADMIN_PASSWORD
        generateValue: true
      - key: SALON_PRO_AUTO_CREATE_DB
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SALON_PRO_MONTHLY_PRICE_INR
        value: "499"
      - key: SALON_PRO_BILLING_REQUIRED
        value: "1"
      - key: SALON_PRO_LEGACY_TRIAL_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: salon-pro-db
          property: connectionString
databases:
  - name: salon-pro-db
